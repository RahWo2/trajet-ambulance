<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ambumaps</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0e1014"><meta name="mobile-web-app-capable" content="yes"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png"><style id="css">
:root{--bg:#0e1014;--card:#181b22;--card2:#20242d;--line:#2c313c;--txt:#f1f3f6;--mut:#9aa3b2;--acc:#4f8cff;--ok:#2fbf71;--warn:#f5a524;--red:#e5484d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:rgba(14,16,20,.96);border-bottom:1px solid var(--line);padding:10px 14px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:19px;margin:0;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
h1 .logo{height:28px;width:auto;flex:none}
.hero .logo{height:64px;width:auto}
.status{font-size:12.5px;color:var(--mut);text-align:right}
.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}
nav{display:flex;gap:4px;margin-top:10px}
nav a{flex:1 1 auto;text-align:center;padding:11px 5px;color:var(--mut);text-decoration:none;font-weight:600;font-size:14.5px;border-bottom:3px solid transparent;white-space:nowrap}
nav a.on{color:var(--txt);border-color:var(--acc)}
main{max-width:720px;margin:0 auto;padding:14px 14px 60px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:22px 0 10px}
h2:first-child{margin-top:4px}
section[data-k]>h2:first-child{margin-top:22px}
main>section[data-k]:first-child>h2:first-child{margin-top:4px}
.tiles{display:grid;gap:10px}
.tile{display:flex;align-items:center;gap:14px;width:100%;min-height:74px;padding:12px 14px;background:var(--card);border:2px solid var(--line);border-left:8px solid var(--c,#555);border-radius:14px;color:var(--txt);font:inherit;text-align:left;cursor:pointer}
.tile .ic{font-size:28px;width:34px;text-align:center}
.tile b{display:block;font-size:17.5px}
.tile small{color:var(--mut);font-size:14px}
.tile.on{border-color:var(--c);background:var(--card2);box-shadow:0 0 0 2px var(--c) inset}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:12px 14px;min-height:50px;background:var(--card);border:2px solid var(--line);border-radius:12px;color:var(--txt);font:inherit;font-weight:600;cursor:pointer;text-align:left}
.chip small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.chip.on{border-color:var(--acc);background:#1b2a47}
.or{color:var(--mut);font-size:14px;margin:14px 0 8px}
input,select,textarea{width:100%;padding:13px 12px;background:var(--card);border:2px solid var(--line);border-radius:12px;color:var(--txt);font:inherit}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 5px}
.hint{font-size:13px;color:var(--mut);margin-top:4px}
.empty{padding:16px;border:2px dashed var(--line);border-radius:14px;color:var(--mut);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 18px;border-radius:12px;border:2px solid var(--line);background:var(--card2);color:var(--txt);font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{border-color:#5a2427;color:#ff8a8d}
.btn.small{min-height:40px;padding:8px 12px;font-size:14.5px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.go{display:grid;gap:10px;margin-top:16px}
.go .btn{min-height:64px;font-size:19px;width:100%}
.go .btn small{font-weight:600;font-size:12.5px;opacity:.85;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:20px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:6px}
.band{padding:14px 16px;background:var(--c);color:#fff}
.band b{font-size:21px;display:block}
.band span{font-size:14.5px;opacity:.95}
.blk{padding:14px 16px;border-top:1px solid var(--line)}
.blk h3{margin:0 0 8px;font-size:13.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.dest{font-size:19px;font-weight:700}
.addr{color:var(--mut);font-size:15px}
.infos{margin-top:10px;padding:10px 12px;background:#2a2410;border:1px solid #5b4a15;border-radius:10px;color:#ffe3a3;white-space:pre-wrap;font-size:15.5px}
ul{margin:0;padding-left:20px}li{margin:4px 0}
.zone{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.zone:last-child{border-bottom:0}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:#3a2a10;color:#ffc46b;white-space:nowrap}
.tag.blue{background:#16284a;color:#9cc0ff}
button.tag{border:0;font-family:inherit;cursor:pointer;margin:1px 0}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px}
.tagb{padding:8px 13px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.tagb.on{background:#16284a;border-color:#4c8dff;color:#9cc0ff}.tagb.on::before{content:none}
.tagadd{margin-top:10px;flex-wrap:nowrap}.tagadd input{flex:1;min-width:0}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.item .t{font-weight:700;font-size:17.5px}
.item .m{color:var(--mut);font-size:14.5px;margin-top:2px}
.item .x{white-space:pre-wrap;font-size:14.5px;margin-top:8px;color:#d6dae2}
.item .row{margin-top:10px}
.form{background:var(--card);border:2px solid var(--acc);border-radius:14px;padding:6px 14px 14px;margin-bottom:14px}
.confirm{margin-top:10px;padding:10px;border-radius:10px;background:#2b1416;border:1px solid #5a2427;font-size:15px}
.foot{margin-top:18px;font-size:13px;color:var(--mut);line-height:1.5}
.reset{margin-top:12px;width:100%}
.hero{text-align:center;padding:14px 6px 4px}.hero .big{font-size:46px;line-height:1}.hero h2{font-size:21px;text-transform:none;letter-spacing:0;color:var(--txt);margin:10px 0 6px}.hero p{color:var(--mut);margin:0 0 6px;font-size:15.5px}
.warnbox{margin-top:12px;padding:12px;border-radius:12px;background:#2a2410;border:1px solid #5b4a15;color:#ffe3a3;font-size:15px}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto 16px}@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center;color:var(--mut)}
.grp{display:flex;align-items:center;gap:10px;margin:20px 0 2px;font-weight:700;font-size:16px}.grp small{color:var(--mut);font-weight:400}
.res{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line)}.res b{font-weight:600}.res small{display:block;color:var(--mut);font-size:13.5px}.res.off{opacity:.5}
.res input,.grp input{width:22px;height:22px;min-width:22px;padding:0;margin:2px 0 0;accent-color:var(--acc)}
.stick{position:sticky;bottom:0;padding:16px 0 10px;background:linear-gradient(rgba(14,16,20,0),var(--bg) 35%)}
.btn.wide{width:100%}
.radius .chip{min-width:70px;text-align:center}
.hr{display:flex;align-items:center;gap:8px}
.gear{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;width:40px;height:36px;font-size:18px;text-decoration:none;color:var(--txt)}.gear.on{border-color:var(--acc);background:rgba(76,141,255,.12)}
.depotb{margin-top:14px}
.sync{background:none;border:1px solid var(--line);color:var(--txt);border-radius:10px;width:40px;height:36px;font-size:19px;cursor:pointer}
details summary{cursor:pointer;color:var(--acc)}
.map{height:300px;border-radius:12px;margin-top:6px;border:1px solid var(--line);background:#1d2129;overflow:hidden;position:relative;z-index:0}
.map.small{height:240px}
.map.small{height:300px}
.fullmap{position:fixed;inset:0;z-index:2000;background:var(--bg);display:flex;flex-direction:column}
.fmbar{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--card)}
.fmbar b{flex:1;font-size:17px}
#fmap{flex:1;min-height:0}
.fmleg{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom));font-size:13px;color:var(--mut);background:var(--card);border-top:1px solid var(--line)}
.fmleg span{display:inline-flex;align-items:center;gap:6px}
.fmleg i{display:inline-block;width:14px;height:14px}
.leaflet-popup-content{color:#111;font-size:14px}
.leaflet-popup-content .btn{color:#111;background:#eef1f6;border-color:#c9cfd9}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;margin-top:8px;background:var(--card2);border:2px solid var(--line);border-radius:12px;color:var(--txt);font:inherit;cursor:pointer}
.opt.on{border-color:var(--acc);background:#1b2a47}
.opt small{display:block;color:var(--mut);font-size:13.5px;margin-top:2px}
.leaflet-container{font:inherit}
.blk.cur{border-left:5px solid var(--acc);background:#1b2233}
.blk.past{opacity:.75;padding:10px 16px}
.step-n{display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;font-size:13px;margin-right:6px}
.blk.past .step-n{background:var(--ok)}
.acw{position:relative;min-width:0}
.acw .ac{position:absolute;left:0;right:0;top:100%;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.ac{margin-top:6px;background:var(--card2);border:2px solid var(--acc);border-radius:12px;overflow:hidden}
.ac button{display:block;width:100%;text-align:left;padding:11px 12px;background:none;border:0;border-top:1px solid var(--line);color:var(--txt);font:inherit;cursor:pointer}
.ac button:first-child{border-top:0}
.ac button:active,.ac button:hover{background:#1b2a47}
.ac b{font-weight:600}
.ac small{display:block;color:var(--mut);font-size:13.5px}
.ac .src{padding:7px 12px;font-size:12px;color:var(--mut);border-top:1px solid var(--line)}
.ac .wait{padding:11px 12px;color:var(--mut);font-size:14.5px}
.ac .acrow{position:relative;border-top:1px solid var(--line)}
.ac .acrow:first-child{border-top:0}
.ac .acrow button[data-a="acPick"]{border-top:0;padding-right:54px}
.ac button.fav{position:absolute;top:50%;right:4px;transform:translateY(-50%);width:44px;height:44px;padding:0;border:0;text-align:center;font-size:22px;color:var(--mut)}
.ac button.fav.on{color:#f5c518}
.check{display:flex;align-items:center;gap:14px;width:100%;margin-top:14px;padding:14px 16px;min-height:66px;background:var(--card2);border:2px dashed var(--ok);border-radius:14px;color:var(--txt);font:inherit;text-align:left;cursor:pointer}
.check .box{flex:0 0 34px;height:34px;border:3px solid var(--ok);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;line-height:1}
.check b{display:block;font-size:18px}
.check small{display:block;color:var(--mut);font-size:13.5px;margin-top:2px}
.check.on{border-style:solid;background:#173325}
.check.on .box{background:var(--ok)}
.chipw{position:relative;display:inline-flex}
.chipw .chip{padding-right:46px}
.fav{position:absolute;top:50%;right:4px;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--mut);font-size:22px;line-height:1;cursor:pointer;border-radius:10px}
.fav.on{color:#f5c518}
.btn.favb.on{color:#f5c518;border-color:#6b5a14}
.sub{font-size:13px;color:var(--mut);margin:2px 0 8px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:104px;padding:12px 8px;background:var(--card);border:2px solid var(--line);border-top:7px solid var(--c);border-radius:14px;color:var(--txt);font:inherit;text-align:center;cursor:pointer}
.mode .ic{font-size:30px;line-height:1.1}
.mode b{font-size:17px;line-height:1.2}
.mode small{color:var(--mut);font-size:13px;line-height:1.3}
.mode.on{border-color:var(--c);background:var(--card2);box-shadow:0 0 0 2px var(--c) inset}
.modes.picked .mode{min-height:62px;flex-direction:row;gap:8px}
.modes.picked .mode .ic{font-size:22px}
.modes.picked .mode small{display:none}
.done{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 10px 10px 12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c,var(--ok));border-radius:12px}
.done .step-n{background:var(--ok);margin:0}
.donegrp{margin-top:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c,var(--ok));border-radius:12px;overflow:hidden}
.donegrp .done{margin:0;border:0;border-radius:0;background:none;padding:10px 10px 10px 12px}
.donegrp .done+.done{border-top:1px solid var(--line)}
.done .k{flex:1;min-width:0}
.done small{display:block;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.done b{display:block;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.nowrap{flex-wrap:nowrap}
.row.nowrap .btn{flex:0 0 auto}
.nav2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.nav2 .btn{min-height:60px;font-size:18px;padding:10px 8px;text-align:center}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.blk.next{color:var(--mut);font-size:15px}
.blk.next b{color:var(--txt)}
:root{--spr:cubic-bezier(.32,.72,0,1)}
button,.btn,.tile,.mode,.chip,.opt,.check,.gear{transition:transform .5s var(--spr),opacity .3s ease,background-color .25s ease,border-color .25s ease,box-shadow .25s ease;-webkit-tap-highlight-color:transparent}
button:active,.btn:active,.tile:active,.mode:active,.chip:active,.opt:active,.check:active,.gear:active{transform:scale(.97);opacity:.82;transition-duration:.12s,.08s,.25s,.25s,.25s}
/* Animations : seul ce qui apparaît bouge, le reste ne clignote pas */
/* Transitions : courbe « ressort » façon iOS ; ce qui reste bouge en douceur, ce qui arrive glisse, ce qui part s'efface */
#ghosts{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
nav{position:relative}nav a.on{border-color:transparent}
nav .tabind{position:absolute;left:0;bottom:0;width:0;height:3px;border-radius:3px 3px 0 0;background:var(--acc);pointer-events:none;opacity:0}
.ac:not([hidden]){animation:acin .32s var(--spr);transform-origin:top center}@keyframes acin{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== Nouvelle disposition : menu, pages entières, icônes dessinées ===== */
svg.i{width:1.2em;height:1.2em;flex:0 0 auto;vertical-align:-.22em}
.btn svg.i{width:1.25em;height:1.25em}
.yel{color:#f5c518}.wc{color:var(--warn)}.okc{color:var(--ok)}.redc{color:#ff5a5f}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{background:var(--bg);min-height:100vh}
header{padding:10px 14px}
header .top{min-height:48px}
header .top h1{flex:1 1 auto;min-width:0}
header .top h1 .logo{height:29px}
h1.pt{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.menub{width:46px;height:46px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--txt);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;transition:transform .5s var(--spr),background-color .25s ease}
.menub:active{transform:scale(.92)}
.menub svg.i{width:24px;height:24px}
.status{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13.5px;font-weight:600;max-width:150px;overflow:hidden}
.status span{overflow:hidden;text-overflow:ellipsis}
.status svg.i{width:17px;height:17px}
.status:empty{display:none}
button.status{background:none;border:0;font-family:inherit;cursor:pointer;padding:8px 2px;min-height:44px}
/* en-tête des pages Urgence / Transport programmé */
header.fh{padding:12px 14px 14px;background:var(--fbg);border-bottom:1px solid var(--fbd)}
header.fh.urg{--fbg:#2a1416;--fbd:#5a2427;--fc:#d93a3f;--fl:#ff6b70;--ft:#ffd2d4;--fm:#c9a9ab}
header.fh.prog{--fbg:#10241b;--fbd:#1f4d36;--fc:#2f9e6a;--fl:#45d08f;--ft:#c6f1db;--fm:#9fbfae}
header.fh .top{justify-content:flex-start;gap:12px}
header.fh .back{background:rgba(255,255,255,.08);border:0}
.fic{width:40px;height:40px;border-radius:50%;background:var(--fc);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.fic svg.i{width:22px;height:22px}
header.fh h1{font-size:clamp(19px,5.6vw,24px);letter-spacing:-.2px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsteps{display:grid;gap:8px;margin-top:14px}
.fs i{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.16);transition:background-color .45s ease}
.fs span{display:block;margin-top:7px;font-size:13.5px;font-weight:600;color:var(--fm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs.fsd i,.fs.on i{background:var(--fl)}
.fs.on span{color:var(--ft);font-weight:800}
/* accueil */
.ttl{font-size:30px;font-weight:800;letter-spacing:-.3px;margin:16px 0 18px;display:block}
.bigmodes{display:grid;gap:14px}
.bigmode{display:flex;align-items:center;gap:18px;width:100%;min-height:150px;padding:0 22px;border-radius:24px;font:inherit;color:var(--txt);text-align:left;cursor:pointer}
.bigmode.urg{background:#2a1416;border:1px solid #5a2427}
.bigmode.prog{background:#10241b;border:1px solid #1f4d36}
.bigmode .bic{width:68px;height:68px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff}
.bigmode.urg .bic{background:#d93a3f}.bigmode.prog .bic{background:#2f9e6a}
.bigmode .bic svg.i{width:34px;height:34px}
.bigmode b{flex:1 1 auto;font-size:27px;font-weight:800;line-height:1.12}
.bigmode .chv{width:26px;height:26px}
.bigmode.urg .chv{color:#e89a9d}.bigmode.prog .chv{color:#8fd3b0}
.bigmode:active{transform:scale(.98)}
.btn.depotb{margin-top:18px;min-height:60px;font-size:18px;border-radius:18px}
.depotb svg.i{color:var(--mut)}
/* pages entières : question, recherche, lieux */
main.flow{--fl:#45d08f}
main.flow.urg{--fl:#ff8a8e}
main.flow section[data-k]>h2.q:first-child,h2.q{font-size:23px;font-weight:800;text-transform:none;letter-spacing:0;color:var(--txt);margin:10px 0 14px}
.srow{display:flex;gap:10px}
.srow .acw{flex:1 1 auto}
.sfield{display:flex;align-items:center;gap:10px;min-height:58px;padding:0 14px;border-radius:16px;background:var(--card);border:1.5px solid #3a404c;transition:border-color .25s ease}
.sfield:focus-within{border-color:var(--acc)}
.sfield>svg.i{color:var(--mut);width:20px;height:20px}
.sfield input{flex:1 1 auto;width:auto;min-width:0;background:none;border:0;outline:none;padding:0;min-height:54px;font-size:17.5px;border-radius:0}
.btn.sgo{width:58px;min-height:58px;padding:0;border-radius:16px;flex:0 0 auto}
.btn.sgo svg.i{width:24px;height:24px}
main.flow.urg .btn.sgo{background:#d93a3f;border-color:#d93a3f}
main.flow.prog .btn.sgo{background:#2f9e6a;border-color:#2f9e6a}
.lockh{display:flex;align-items:center;gap:8px;margin-top:10px}
.lockh svg.i{width:16px;height:16px}
h3.lh{font-size:14.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);margin:24px 0 10px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px;align-items:stretch}
