 else if(a==="inviteShow"){ui.invite=true;ui.inviteErr="";ui.invited=null;render();}
 else if(a==="inviteCancel"){ui.invite=false;render();}
 else if(a==="copyInvite"){var im=document.getElementById("invMsg");try{navigator.clipboard.writeText(inviteMsg(ui.invited)).then(function(){if(im)im.textContent="✓ Message copié.";},function(){if(im)im.textContent="Copie bloquée : recopie le message à la main.";});}catch(e){}}
 else if(a==="role"){var mm=null;cloud.members.forEach(function(m){if(m.email===id)mm=m;});if(mm)teamAction(api("PATCH","membres?email=eq."+encodeURIComponent(id),{role:mm.role==="admin"?"membre":"admin"},"return=minimal"));}
 else if(a==="delMember"){ui.confirm=null;teamAction(api("DELETE","membres?email=eq."+encodeURIComponent(id)));}
 else if(a==="pushBackup"){var bk=state.localBackup||{etabs:[],zones:[]},ids={},osms={},base2=nextOrdre(),newE=[],newZ=[];
  state.etabs.forEach(function(x){ids[x.id]=1;if(x.osm)osms[x.osm]=1;});
  bk.etabs.forEach(function(x){if(ids[x.id]||(x.osm&&osms[x.osm]))return;var e=JSON.parse(JSON.stringify(x));e.ordre=base2+newE.length;newE.push(e);ids[e.id]=1;});
  (bk.zones||[]).forEach(function(z){var c=JSON.parse(JSON.stringify(z));if(c.etab&&!ids[c.etab])c.etab="";newZ.push(c);});
  state.etabs=state.etabs.concat(newE);state.zones=state.zones.concat(newZ);delete state.localBackup;save();
  if(newE.length)enqueue({t:"putE",rows:newE.map(etabRow)});if(newZ.length)enqueue({t:"putZ",rows:newZ.map(zoneRow)});render();}
 else if(a==="dropBackup"){delete state.localBackup;save();render();}
 else if(a==="reset"){ui.etat=null;ui.destId=null;ui.libre="";keepUi();render();window.scrollTo(0,0);}
 else if(a==="newEtab"){ui.form={kind:"etab"};ui.confirm=null;render();}
 else if(a==="editEtab"){ui.form={kind:"etab",id:id};ui.confirm=null;render();window.scrollTo(0,0);}
 else if(a==="newZone"){ui.form={kind:"zone"};ui.confirm=null;render();}
 else if(a==="editZone"){ui.form={kind:"zone",id:id};ui.confirm=null;render();window.scrollTo(0,0);}
 else if(a==="cancel"){ui.form=null;render();}
 else if(a==="askDel"){ui.confirm=id;render();}
 else if(a==="noDel"){ui.confirm=null;render();}
 else if(a==="delEtab"){state.etabs=state.etabs.filter(function(x){return x.id!==id;});state.zones.forEach(function(z){if(z.etab===id)z.etab="";});if(ui.destId===id)ui.destId=null;ui.confirm=null;save();enqueue({t:"delE",id:id});render();}
 else if(a==="up"||a==="down"){var k=-1;state.etabs.forEach(function(x,i){if(x.id===id)k=i;});var j=a==="up"?k-1:k+1;if(k>=0&&j>=0&&j<state.etabs.length){var t=state.etabs[k];state.etabs[k]=state.etabs[j];state.etabs[j]=t;state.etabs.forEach(function(x,ix){x.ordre=ix;});save();enqueue({t:"putE",rows:state.etabs.map(etabRow)});render();}}
 else if(a==="delZone"){state.zones=state.zones.filter(function(x){return x.id!==id;});ui.confirm=null;save();enqueue({t:"delZ",id:id});render();}
});
document.addEventListener("input",function(ev){
 if(ev.target.id==="filtre"){var q=ev.target.value.trim().toLowerCase();Array.prototype.forEach.call(document.querySelectorAll(".chip"),function(c){c.style.display=(!q||c.getAttribute("data-q").indexOf(q)>=0)?"":"none";});return;}
 if(ev.target.id==="libre"){ui.libre=ev.target.value;if(ui.libre.trim()&&ui.destId){ui.destId=null;var on=document.querySelector(".chip.on");if(on)on.classList.remove("on");}keepUi();paintFeuille();}
});
document.addEventListener("submit",function(ev){
 var f=ev.target;var k=f.getAttribute("data-f");if(!k)return;ev.preventDefault();
 if(k==="auth"){var au=ui.auth,em=(f.elements.email.value||"").trim(),pw=f.elements.pw.value||"";au.email=em;au.err="";au.msg="";
  if(au.step==="signup"){if(pw.length<8){au.err="Mot de passe trop court : 8 caractères minimum.";render();return;}if(pw!==f.elements.pw2.value){au.err="Les deux mots de passe ne sont pas identiques.";render();return;}}
  var sb=f.querySelector('button[type="submit"]');if(sb){sb.disabled=true;sb.textContent="Connexion…";}
  (au.step==="signup"?doSignup(em,pw):doLogin(em,pw)).then(function(){ui.auth=null;render();window.scrollTo(0,0);},function(e){au.err=netErr(e)?"Pas de connexion internet.":e.message;render();});
  return;}
 if(k==="invite"){var ie=(f.elements.email.value||"").trim().toLowerCase(),inom=(f.elements.nom.value||"").trim(),irole=f.elements.role.value;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(ie)){ui.inviteErr="Adresse e-mail invalide.";render();return;}
  ui.inviteErr="";api("POST","membres",{email:ie,nom:inom||null,role:irole},"return=minimal").then(function(){ui.invite=false;ui.invited=ie;return sync();},function(e){ui.inviteErr=netErr(e)?"Pas de connexion internet.":(/23505|duplicate|409/i.test(e.message)?"Cette adresse est déjà dans l'équipe.":e.message);render();});
  return;}
 if(k==="depart"){var dq=(f.elements.q.value||"").trim();ui.dep=dq?{mode:"addr",q:dq}:null;ui.depEdit=false;paintFeuille();return;}
 if(k==="ville"){var q=(f.elements.ville.value||"").trim();if(q&&ui.search){ui.search.q=q;searchCity(q);}return;}
 var v={};Array.prototype.forEach.call(f.elements,function(el){if(el.name)v[el.name]=el.value.trim();});
 if(!v.nom)return;
 var chE=null,chZ=null;
 if(k==="etab"){if(!v.adresse)return;
  if(ui.form.id){var x=etab(ui.form.id);if(x){if(x.adresse!==v.adresse){delete x.lat;delete x.lon;}x.nom=v.nom;x.type=v.type;x.adresse=v.adresse;x.infos=v.infos;x.via=v.via;chE=x;}}
  else{chE={id:uid(),nom:v.nom,type:v.type,adresse:v.adresse,infos:v.infos,via:v.via,ordre:nextOrdre()};state.etabs.push(chE);}}
 else{
  if(ui.form.id){state.zones.forEach(function(z){if(z.id===ui.form.id){z.nom=v.nom;z.type=v.type;z.etab=v.etab;z.note=v.note;chZ=z;}});}
  else{chZ={id:uid(),nom:v.nom,type:v.type,etab:v.etab,note:v.note};state.zones.push(chZ);}
  if(chZ){var zl=parseFloat(v.lat),zo=parseFloat(v.lon);if(isNaN(zl)||isNaN(zo)){delete chZ.lat;delete chZ.lon;delete chZ.rayon;}else{chZ.lat=zl;chZ.lon=zo;chZ.rayon=parseInt(v.rayon,10)||60;}}}
 ui.form=null;save();
 if(chE)enqueue({t:"putE",rows:[etabRow(chE)]});
 if(chZ)enqueue({t:"putZ",rows:[zoneRow(chZ)]});
 render();
});
window.addEventListener("hashchange",function(){ui.form=null;ui.confirm=null;if(ui.search&&ui.search.step==="adding")return;render();window.scrollTo(0,0);});
if(state.team&&state.team.members)cloud.members=state.team.members;
if(sess)cloud.members.forEach(function(m){if(m.email===sess.email)cloud.me=m;});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&isCloud())sync();});
window.addEventListener("online",function(){if(isCloud())sync();});
render();
if(isCloud())sync();
if("serviceWorker" in navigator&&location.protocol==="https:"){try{navigator.serviceWorker.register("sw.js");}catch(e){}}
})();
