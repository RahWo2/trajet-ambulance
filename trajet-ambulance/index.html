.radius .chip{min-width:70px;text-align:center}

/* ===== Recherche des établissements autour de moi ===== */
var GROUPS=[
 {k:"urgences",label:"Urgences",type:"Urgences",on:true},
 {k:"hopital",label:"Hôpitaux et cliniques",type:"CHU / Hôpital",on:true},
 {k:"dialyse",label:"Dialyse",type:"Dialyse",on:true},
 {k:"imagerie",label:"Imagerie (radio, scanner, IRM)",type:"Imagerie",on:true},
 {k:"smr",label:"Rééducation (SMR)",type:"SMR / Rééducation",on:true},

var OVERPASS=["https://overpass-api.de/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter","https://overpass.private.coffee/api/interpreter"];

function classify(t){
 var am=t.amenity||"",hc=t.healthcare||"",sp=(t["healthcare:speciality"]||"").toLowerCase(),sf=t.social_facility||"",nm=(t.name||"").toLowerCase();
 if(sf==="nursing_home"||am==="nursing_home")return "ehpad";

 if((/radiolog/.test(sp)||/imagerie|\birm\b|scanner|radiologie/.test(nm))&&!/radioth/.test(sp+" "+nm))return "imagerie";

 if(hc==="rehabilitation"||/rehabilitation/.test(sp)||/\bsmr\b|\bssr\b|réadaptation|rééducation/.test(nm))return "smr";

 return '[out:json][timeout:50][bbox:'+bb+'];(nwr["amenity"~"^(hospital|clinic|nursing_home)$"];nwr["healthcare"~"^(hospital|clinic|dialysis|rehabilitation|centre)$"];nwr["healthcare:speciality"~"radiology|dialysis|nephrology"];nwr["social_facility"="nursing_home"];);out center tags;';
}

  });

function osmAddr(t){var a=[t["addr:housenumber"],t["addr:street"]].filter(Boolean).join(" "),c=[t["addr:postcode"],t["addr:city"]].filter(Boolean).join(" ");return(t["addr:street"]&&t["addr:city"])?a+", "+c:"";}

  var b3=document.getElementById("bkMsg");if(b3)b3.textContent="✓ Données restaurées.";}catch(e){bm2.textContent="Ces données ne sont pas valides.";}}
 else if(a==="searchStart"){startSearch();}
 else if(a==="searchSkip"){endSearch();}
 else if(a==="searchBack"){var s0=ui.search;if(s0){s0.step="start";s0.results=null;render();window.scrollTo(0,0);}}
 else if(a==="radius"){ui.search.radius=+b.getAttribute("data-v");render();}
 else if(a==="locate"){locate();}
 else if(a==="retry"){var s1=ui.search;searchAround(s1.center.lat,s1.center.lon,s1.center.label);}
 else if(a==="villePick"){var v=ui.search.villes[+b.getAttribute("data-i")];searchAround(v.lat,v.lon,v.label);}
 else if(a==="addSel"){addSelected();}
 else if(a==="delAll"){state.etabs=[];state.zones.forEach(function(z){z.etab="";});ui.destId=null;ui.confirm=null;save();render();}
 else if(a==="reset"){ui.etat=null;ui.destId=null;ui.libre="";keepUi();render();window.scrollTo(0,0);}
 else if(a==="newEtab"){ui.form={kind:"etab"};ui.confirm=null;render();}
 else if(a==="editEtab"){ui.form={kind:"etab",id:id};ui.confirm=null;render();window.scrollTo(0,0);}
 else if(a==="newZone"){ui.form={kind:"zone"};ui.confirm=null;render();}
 else if(a==="editZone"){ui.form={kind:"zone",id:id};ui.confirm=null;render();window.scrollTo(0,0);}
 else if(a==="cancel"){ui.form=null;render();}
 else if(a==="askDel"){ui.confirm=id;render();}
 else if(a==="noDel"){ui.confirm=null;render();}
 else if(a==="delEtab"){state.etabs=state.etabs.filter(function(x){return x.id!==id;});state.zones.forEach(function(z){if(z.etab===id)z.etab="";});if(ui.destId===id)ui.destId=null;ui.confirm=null;save();render();}
 else if(a==="up"||a==="down"){var k=-1;state.etabs.forEach(function(x,i){if(x.id===id)k=i;});var j=a==="up"?k-1:k+1;if(k>=0&&j>=0&&j<state.etabs.length){var t=state.etabs[k];state.etabs[k]=state.etabs[j];state.etabs[j]=t;save();render();}}
 else if(a==="delZone"){state.zones=state.zones.filter(function(x){return x.id!==id;});ui.confirm=null;save();render();}
});
document.addEventListener("input",function(ev){
 if(ev.target.id==="filtre"){var q=ev.target.value.trim().toLowerCase();Array.prototype.forEach.call(document.querySelectorAll(".chip"),function(c){c.style.display=(!q||c.getAttribute("data-q").indexOf(q)>=0)?"":"none";});return;}
 if(ev.target.id==="libre"){ui.libre=ev.target.value;if(ui.libre.trim()&&ui.destId){ui.destId=null;var on=document.querySelector(".chip.on");if(on)on.classList.remove("on");}keepUi();paintFeuille();}
});
document.addEventListener("submit",function(ev){
 var f=ev.target;var k=f.getAttribute("data-f");if(!k)return;ev.preventDefault();
 if(k==="ville"){var q=(f.elements.ville.value||"").trim();if(q&&ui.search){ui.search.q=q;searchCity(q);}return;}
 var v={};Array.prototype.forEach.call(f.elements,function(el){if(el.name)v[el.name]=el.value.trim();});
 if(!v.nom)return;
 if(k==="etab"){if(!v.adresse)return;
  if(ui.form.id){var x=etab(ui.form.id);if(x){if(x.adresse!==v.adresse){delete x.lat;delete x.lon;}x.nom=v.nom;x.type=v.type;x.adresse=v.adresse;x.infos=v.infos;x.via=v.via;}}
  else state.etabs.push({id:uid(),nom:v.nom,type:v.type,adresse:v.adresse,infos:v.infos,via:v.via});}
 else{
  if(ui.form.id){state.zones.forEach(function(z){if(z.id===ui.form.id){z.nom=v.nom;z.type=v.type;z.etab=v.etab;z.note=v.note;}});}
  else state.zones.push({id:uid(),nom:v.nom,type:v.type,etab:v.etab,note:v.note});}
 ui.form=null;save();render();
});
window.addEventListener("hashchange",function(){ui.form=null;ui.confirm=null;if(ui.search&&ui.search.step==="adding")return;render();window.scrollTo(0,0);});
render();

})();
